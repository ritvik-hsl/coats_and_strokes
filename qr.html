<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Code — Coats & Strokes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💅</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root {
    --bg: #b7a4fb;
    --card: #15130f;
    --text: #f8f6f2;
    --muted: #bdb9c9;
    --accent: #f7abda;
    --accent-deep: #ef62b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--card);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .page {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 {
    font-family: "Unbounded", sans-serif;
    font-size: 22px;
    margin: 0 0 8px;
    font-weight: 800;
  }
  p.url {
    color: rgba(21,19,15,0.65);
    font-size: 13px;
    word-break: break-all;
    margin: 0 0 24px;
  }
  #qr {
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    display: inline-block;
    border: 2px solid var(--card);
  }
  #qr canvas { display: block; }
  .btn {
    margin-top: 24px;
    display: inline-block;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    padding: 13px 26px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  .btn:active { transform: scale(0.98); }
  footer {
    margin-top: 32px;
    color: rgba(21,19,15,0.6);
    font-size: 12px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Your QR code</h1>
    <p class="url" id="target-url"></p>
    <div id="qr"></div>
    <div>
      <button class="btn" id="download">Download PNG</button>
    </div>
    <footer>
      This QR always points to this site's home page.<br>
      Update the links on the page any time — the QR code<br>never needs to change.
    </footer>
  </div>

  <script>
    // Encode this deployment's own home page, so the QR is always
    // correct no matter what domain it ends up hosted on.
    // Override with ?url=https://example.com if you ever need to.
    const params = new URLSearchParams(location.search);
    const target = params.get("url") || (location.origin + "/");

    document.getElementById("target-url").textContent = target;

    const canvas = document.createElement("canvas");
    document.getElementById("qr").appendChild(canvas);

    QRCode.toCanvas(canvas, target, { width: 280, margin: 1 }, (err) => {
      if (err) console.error(err);
    });

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "coats-and-strokes-qr.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
