<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coats & Strokes</title>
<meta name="description" content="Coats & Strokes — find us on social media" />
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #0f0f10;
    --card: #1a1a1c;
    --text: #f5f5f5;
    --muted: #a1a1a6;
    --accent: #e5b567;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .page {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7a5c2e);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1c;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  p.tagline {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 14px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    padding: 16px 20px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.08);
    font-weight: 600;
    font-size: 16px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:active { transform: scale(0.98); }
  .link-btn:hover { border-color: var(--accent); }
  .link-btn svg { flex-shrink: 0; width: 24px; height: 24px; }
  .link-btn span { flex: 1; text-align: left; }
  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 12px;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="page">
    <div class="avatar">C&amp;S</div>
    <h1>Coats &amp; Strokes</h1>
    <p class="tagline">Follow us for updates</p>
    <nav class="links" id="links"></nav>
    <footer>Scan the QR, bookmark this page — links here update anytime.</footer>
  </div>

  <script>
    /*
     * ── Edit your links here ──────────────────────────────
     * Add, remove, or change entries in this array to update
     * what people see when they scan the QR code. The QR code
     * itself never needs to change — it always points to this
     * page's URL.
     */
    const LINKS = [
      {
        name: "YouTube",
        url: "https://www.youtube.com/",
        icon: `<svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/></svg>`
      },
      {
        name: "Instagram",
        url: "https://www.instagram.com/",
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="url(#ig-grad)" stroke-width="1.8"><defs><linearGradient id="ig-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#FEDA75"/><stop offset="30%" stop-color="#FA7E1E"/><stop offset="60%" stop-color="#D62976"/><stop offset="100%" stop-color="#962FBF"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.2" cy="6.8" r="1" fill="url(#ig-grad)" stroke="none"/></svg>`
      }
    ];
    // ───────────────────────────────────────────────────────

    const container = document.getElementById("links");
    LINKS.forEach(({ name, url, icon }) => {
      const a = document.createElement("a");
      a.className = "link-btn";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `${icon}<span>${name}</span>`;
      container.appendChild(a);
    });
  </script>
</body>
</html>
